<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vansh Furniture Five Star</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #E3F2FD;
            color: #0D47A1;
        }
        header {
            background-color: #90CAF9;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #01579B;
        }
        nav a {
            color: #0D47A1;
            text-decoration: none;
            font-weight: bold;
            margin-left: 15px;
            padding: 8px 12px;
            background-color: #ffffff;
            border-radius: 5px;
        }
        .login-buttons button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            transition: opacity 0.2s ease;
        }
        .login-buttons button:hover {
            opacity: 0.85;
        }
        .btn-google { background-color: #DB4437; color: white; }
        .btn-facebook { background-color: #4267B2; color: white; }
        
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h2 {
            text-align: center;
            color: #0277BD;
            margin-bottom: 20px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .video-card iframe {
            width: 100%;
            height: 180px;
            border-radius: 5px;
            border: none;
        }
        .contact-section {
            margin-top: 40px;
            background: #BBDEFB;
            padding: 25px;
            border-radius: 10px;
        }
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }
        .contact-form input, .contact-form textarea {
            padding: 10px;
            border: 1px solid #90CAF9;
            border-radius: 5px;
        }
        .contact-form button {
            padding: 10px;
            background-color: #0277BD;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Vansh Furniture Five Star</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="api.html">AI Assistant</a>
        </nav>
        <div class="login-buttons">
            <button class="btn-google" id="googleLoginBtn">Google Login</button>
            <button class="btn-facebook" id="facebookLoginBtn">Facebook Login</button>
        </div>
    </header>

    <div class="container">
        <h2>Our Furniture Videos</h2>
        <div class="video-grid">
            <div class="video-card">
                <iframe src="https://www.youtube.com/embed/WnZT5tG0PC8" allowfullscreen></iframe>
            </div>
            <div class="video-card">
                <iframe src="https://www.youtube.com/embed/aYPnzeMrwS0" allowfullscreen></iframe>
            </div>
            <div class="video-card">
                <iframe src="https://www.youtube.com/embed/17RRGh_m9-I" allowfullscreen></iframe>
            </div>
        </div>

        <div class="contact-section">
            <h2>Contact Us</h2>
            <form class="contact-form" onsubmit="event.preventDefault(); alert('Dhanyawad! Aapka message mil gaya hai.');">
                <input type="text" placeholder="Aapka Naam" required>
                <input type="email" placeholder="Aapka Email / Phone" required>
                <textarea rows="4" placeholder="Aapka Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // Aapki Firebase Configuration details
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        const facebookProvider = new firebase.auth.FacebookAuthProvider();

        // Google Login Button Click
        document.getElementById("googleLoginBtn").addEventListener("click", () => {
            auth.signInWithPopup(googleProvider)
                .then((result) => {
                    const user = result.user;
                    alert("Swagat hai, " + user.displayName + "!");
                    console.log("User Data:", user);
                })
                .catch((error) => {
                    console.error("Google Login Error:", error);
                    alert("Google Login Error: " + error.message);
                });
        });

        // Facebook Login Button Click
        document.getElementById("facebookLoginBtn").addEventListener("click", () => {
            auth.signInWithPopup(facebookProvider)
                .then((result) => {
                    const user = result.user;
                    alert("Swagat hai, " + user.displayName + "!");
                    console.log("User Data:", user);
                })
                .catch((error) => {
                    console.error("Facebook Login Error:", error);
                    alert("Facebook Login Error: " + error.message);
                });
        });
    </script>
</body>
</html>
