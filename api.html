<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Assistant - Vansh Furniture</title>
    <!-- Markdown Formatting Library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body { 
            background-color: #131314; 
            color: #e3e3e3; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            justify-content: space-between; 
        }
        header { 
            padding: 16px 24px; 
            background-color: #1e1f20; 
            border-bottom: 1px solid #2d2f31; 
        }
        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header .title { 
            font-size: 20px; 
            font-weight: 600; 
            background: linear-gradient(45deg, #4285f4, #9b51e0, #e91e63); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        header .nav-link {
            color: #a8c7fa;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            background-color: #282a2c;
            transition: background 0.2s;
        }
        header .nav-link:hover {
            background-color: #3c4043;
        }
        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 24px 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            max-width: 800px; 
            width: 100%; 
            margin: 0 auto; 
        }
        .message { 
            max-width: 85%; 
            line-height: 1.6; 
            font-size: 15px; 
        }
        .user-message { 
            align-self: flex-end; 
            background-color: #282a2c; 
            padding: 12px 18px; 
            border-radius: 18px 18px 4px 18px; 
            color: #f1f1f1; 
            white-space: pre-wrap;
        }
        .bot-message { 
            align-self: flex-start; 
            background-color: #1e1f20; 
            padding: 14px 20px; 
            border-radius: 18px 18px 18px 4px; 
            border: 1px solid #2d2f31; 
            color: #e3e3e3; 
        }
        .bot-message p { margin-bottom: 8px; }
        .bot-message p:last-child { margin-bottom: 0; }
        .bot-message ul, .bot-message ol { margin-left: 20px; margin-bottom: 8px; }
        .bot-message code { background-color: #2d2f31; padding: 2px 6px; border-radius: 4px; }
        
        .input-container { 
            padding: 16px; 
            background-color: #131314; 
            max-width: 800px; 
            width: 100%; 
            margin: 0 auto; 
        }
        .input-box { 
            display: flex; 
            background-color: #1e1f20; 
            border: 1px solid #3c4043; 
            border-radius: 28px; 
            padding: 8px 16px; 
            align-items: center; 
        }
        textarea { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: #fff; 
            font-size: 16px; 
            padding: 8px; 
            resize: none; 
            outline: none; 
        }
        button { 
            background: #a8c7fa; 
            color: #040e25; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 20px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="title">✨ Gemini AI Assistant</div>
            <a href="index.html" class="nav-link">← Back to Home</a>
        </div>
    </header>

    <div id="chat-container">
        <div class="message bot-message">Namaste! Main Vansh Furniture ka AI assistant hoon. Main aapki kya madad kar sakta hoon?</div>
    </div>

    <div class="input-container">
        <div class="input-box">
            <textarea id="userInput" rows="1" placeholder="Kuch bhi poochhein..."></textarea>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6ICcLfD9nkLFlmmks9PQf5GPpAstJGvLm7TS1DDoDwrIg";

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const prompt = inputField.value.trim();
            const chatContainer = document.getElementById("chat-container");

            if (!prompt) return;

            // User Message UI
            const userDiv = document.createElement("div");
            userDiv.className = "message user-message";
            userDiv.innerText = prompt;
            chatContainer.appendChild(userDiv);

            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Bot Thinking UI
            const botDiv = document.createElement("div");
            botDiv.className = "message bot-message";
            botDiv.innerText = "Soch raha hoon...";
            chatContainer.appendChild(botDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Fetch call passing API key in Headers (exact same structure as Google cURL)
                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "X-goog-api-key": GEMINI_API_KEY
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                    const rawText = data.candidates[0].content.parts[0].text;
                    botDiv.innerHTML = marked.parse(rawText);
                } else if (data.error) {
                    botDiv.innerText = "Error: " + data.error.message;
                } else {
                    botDiv.innerText = "Koi jawab nahi mila.";
                }
            } catch (error) {
                console.error("Error:", error);
                botDiv.innerText = "Network Error: Please check your network connection.";
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        document.getElementById("userInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
